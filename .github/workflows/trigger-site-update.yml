name: Update meister.github.io
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published npm version to deploy
        required: true
        default: latest
permissions:
  contents: read
jobs:
  deploy-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Trigger website update
        env:
          ACTIONS_TOKEN: ${{ secrets.actions_token }}
          VERSION: ${{ inputs.version }}
        run: bash scripts/trigger-workflow.sh "$VERSION"

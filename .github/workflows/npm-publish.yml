name: Publish release to NPM
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  validate:
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged && contains(github.event.pull_request.labels.*.name, 'publish')))
    uses: ./.github/workflows/ci.yml
  publish-npm:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - name: Configure Git identity
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "gh-actions-${GITHUB_ACTOR}@github.com"
      - name: Create version tag
        id: version_tag
        run: echo "version=$(npm version patch --lockfile-version=1 -m 'Version %s')" >> "$GITHUB_OUTPUT"
      - name: Publish to npm
        run: npm publish
      - name: Push release commit and tag
        run: git push origin HEAD:master --follow-tags
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version_tag.outputs.version }}
        run: gh release create "$VERSION" --title "$VERSION" --generate-notes
      - name: Update website with the published version
        env:
          ACTIONS_TOKEN: ${{ secrets.actions_token }}
          VERSION: ${{ steps.version_tag.outputs.version }}
        run: bash scripts/trigger-workflow.sh "$VERSION"
